<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>真戦 兵法帖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@600;700&display=swap">
<style>
:root{
  --bg:      #F7F3E9;
  --surface: #FFFDF7;
  --ink:     #2B2A26;
  --ink-sub: #6B655A;
  --green:   #1F3A2E;
  --green-2: #2C4A3B;
  --accent:  #8B3A2F;
  --line:    #D9D1BE;

  --serif:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --r:6px;
}

*{box-sizing:border-box}
[hidden]{display:none !important}

body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:16px;font-weight:400;line-height:1.8;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;border-radius:var(--r)}
input,textarea{border-radius:var(--r)}
:focus-visible{outline:2px solid var(--green-2);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:700;text-wrap:balance}
p{margin:0}

/* ============ ヘッダー ============ */
header.hata{
  position:sticky;top:0;z-index:40;
  background:var(--green);border-bottom:1px solid var(--green-2);
}
.hata-in{
  max-width:720px;margin:0 auto;padding:12px 20px;
  display:flex;align-items:center;gap:12px;
}
.rakkan{
  flex:none;width:34px;height:34px;border:1px solid var(--bg);border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:700;font-size:16px;line-height:1;color:var(--bg);
}
.banner{display:flex;flex-direction:column;min-width:0}
.banner .nm{
  font-family:var(--serif);font-weight:700;font-size:19px;letter-spacing:.12em;
  line-height:1.4;color:var(--bg);white-space:nowrap;
}
.banner .sub{font-size:11px;letter-spacing:.16em;color:var(--line);margin-top:1px}

.helpbtn{
  margin-left:auto;display:flex;align-items:center;gap:6px;
  min-height:34px;padding:6px 13px;border-radius:var(--r);
  font-size:13px;letter-spacing:.08em;color:var(--bg);
  border:1px solid var(--line);background:transparent;
}
.helpbtn .q{
  display:inline-flex;align-items:center;justify-content:center;
  width:16px;height:16px;border:1px solid currentColor;border-radius:50%;
  font-family:var(--serif);font-weight:700;font-size:10px;line-height:1;
}
.tabs{margin-left:10px;display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tabs button{
  padding:6px 15px;border-radius:0;font-size:13px;letter-spacing:.08em;
  color:var(--line);background:transparent;white-space:nowrap;
}
.tabs button + button{border-left:1px solid var(--line)}
.tabs button[aria-selected="true"]{background:var(--bg);color:var(--green);font-weight:700}

@media (max-width:600px){
  .hata-in{padding:10px 16px;gap:10px}
  .rakkan{width:30px;height:30px;font-size:14px}
  .banner .nm{font-size:16px;letter-spacing:.06em}
  .banner .sub{display:none}
  .helpbtn{min-width:36px;padding:6px;gap:0;justify-content:center}
  .helpbtn .label{display:none}
  .tabs{margin-left:8px}
  .tabs button{padding:6px 12px}
}
@media (max-width:380px){
  .hata-in{padding:10px 14px;gap:8px}
  .banner .nm{font-size:14.5px}
  .tabs button{padding:6px 10px;font-size:12px}
}

/* ============ 器 ============ */
.wrap{max-width:720px;margin:0 auto;padding:0 20px 96px}
@media (max-width:600px){.wrap{padding:0 16px 96px}}

.shirase{
  margin-top:24px;padding:14px 16px;border-radius:var(--r);
  border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--surface);
  font-size:14px;line-height:1.8;color:var(--ink-sub);
}
.shirase b{display:block;font-family:var(--serif);color:var(--green);letter-spacing:.04em}

/* ============ 検索 ============ */
.sagasu{position:relative;margin-top:32px}
.sagasu input{
  width:100%;padding:14px 44px 14px 44px;
  border:1px solid var(--line);background:var(--surface);
  font-size:16px;letter-spacing:.02em;
}
.sagasu input:focus{border-color:var(--green-2);outline:none}
.sagasu input::placeholder{color:var(--ink-sub)}
.sagasu .mag{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--ink-sub);pointer-events:none}
.sagasu .clr{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:36px;height:36px;font-size:18px;line-height:1;color:var(--ink-sub);
}

.chiprow{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:thin}
.chiprow::-webkit-scrollbar{height:4px}
.chiprow::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.gchip{
  flex:none;padding:7px 14px;border-radius:var(--r);font-size:14px;letter-spacing:.02em;
  white-space:nowrap;color:var(--green);background:var(--surface);border:1px solid var(--line);
}
.gchip .n{font-size:12px;margin-left:7px;color:var(--ink-sub);font-variant-numeric:tabular-nums}
.gchip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--bg);font-weight:700}
.gchip[aria-pressed="true"] .n{color:var(--line)}

.tagline{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:12px 0 0}
.tagline .lbl{font-size:12px;letter-spacing:.14em;color:var(--ink-sub);margin-right:4px}
.tag{
  font-size:13px;padding:3px 9px;border-radius:4px;white-space:nowrap;
  color:var(--ink-sub);background:var(--surface);border:1px solid var(--line);
}
button.tag[aria-pressed="true"]{border-color:var(--green);color:var(--green);font-weight:700}

.kensuu{
  display:flex;align-items:center;gap:12px;margin:32px 0 16px;
  font-size:13px;letter-spacing:.14em;color:var(--ink-sub);
}
.kensuu b{font-family:var(--serif);font-size:17px;color:var(--green);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.kensuu .rule{flex:1;height:1px;background:var(--line)}
.kensuu .mini{
  padding:6px 13px;border-radius:var(--r);font-size:13px;letter-spacing:.06em;
  border:1px solid var(--line);background:var(--surface);color:var(--green);
}

/* ============ 章と札 ============ */
.gsec{margin-bottom:48px}
.gsec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.gsec-h h2{font-size:20px;letter-spacing:.1em;color:var(--green);line-height:1.5}
.gsec-h .n{margin-left:auto;font-size:13px;letter-spacing:.12em;color:var(--ink-sub);font-variant-numeric:tabular-nums}

.list{display:flex;flex-direction:column;gap:16px}
.fuda{
  position:relative;display:block;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px 16px;
}
.fuda .k{display:flex;align-items:baseline;gap:10px;font-size:12px;letter-spacing:.12em;color:var(--green-2)}
.fuda .k > span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fuda .k .meta{margin-left:auto;flex:none;padding-left:8px;color:var(--ink-sub);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.fuda h3{font-size:18px;letter-spacing:.04em;line-height:1.65;color:var(--ink);margin-top:6px}
.fuda p{margin:8px 0 0;font-size:14px;line-height:1.8;color:var(--ink-sub);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fuda .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}

.karappo{
  text-align:center;padding:56px 24px;color:var(--ink-sub);font-size:14px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
}
.karappo b{display:block;font-family:var(--serif);font-size:18px;letter-spacing:.06em;color:var(--green);margin-bottom:8px}

.musubi{margin-top:64px;padding-top:24px;border-top:1px solid var(--line);text-align:center}
.musubi .l1{font-family:var(--serif);font-weight:700;font-size:14px;letter-spacing:.24em;color:var(--accent)}
.musubi .l2{font-size:13px;letter-spacing:.08em;color:var(--ink-sub);margin-top:6px}
.musubi button{
  margin-top:20px;min-height:38px;padding:8px 18px;border-radius:var(--r);
  font-size:13px;letter-spacing:.08em;color:var(--green);
  background:var(--surface);border:1px solid var(--line);
}

/* ============ 詳細・使い方 ============ */
.scrim{
  position:fixed;inset:0;z-index:60;background:rgba(43,42,38,.55);
  display:flex;align-items:flex-end;justify-content:center;
  padding-top:calc(64px + env(safe-area-inset-top,0px));
}
@media (min-width:760px){.scrim{align-items:center;padding:40px 24px}}
.sheet{
  background:var(--bg);width:100%;max-width:720px;
  max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  border:1px solid var(--line);border-radius:8px 8px 0 0;
}
@media (min-width:760px){.sheet{border-radius:8px}}
.sheet-top{
  position:sticky;top:0;z-index:2;background:var(--bg);
  padding:14px 20px 12px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;
}
.sheet-top .gn{font-size:12px;letter-spacing:.16em;color:var(--green-2)}
.sheet-top .x{
  margin-left:auto;display:flex;align-items:center;justify-content:center;
  min-width:40px;min-height:40px;margin-right:-8px;
  font-size:20px;line-height:1;color:var(--ink-sub);
}
.sheet-body{padding:24px 20px 32px}
.sheet-body h1{
  font-size:22px;letter-spacing:.06em;line-height:1.7;color:var(--green);
  padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:24px;
}

.doc{font-size:16px;line-height:1.8;color:var(--ink)}
.doc h3{
  font-size:17px;letter-spacing:.08em;color:var(--green);
  margin:32px 0 10px;padding-left:12px;border-left:3px solid var(--green);
}
.doc h3:first-child{margin-top:4px}
.doc p{margin:0 0 16px}
.doc ol{margin:0 0 16px;padding-left:1.5em}
.doc ul{margin:0 0 16px;padding:0;list-style:none}
.doc ul li{position:relative;padding-left:18px;margin-bottom:4px}
.doc ul li::before{content:"";position:absolute;left:2px;top:14px;width:8px;height:1px;background:var(--green-2)}
.doc ol li{margin-bottom:4px}
.doc strong{font-weight:700;color:var(--accent)}
.shots{display:flex;flex-direction:column;gap:14px;margin:20px 0}
.shots img{width:100%;display:block;border:1px solid var(--line);border-radius:var(--r)}
.metabar{
  display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;
  margin-top:28px;padding-top:16px;border-top:1px solid var(--line);
  font-size:12px;letter-spacing:.08em;color:var(--ink-sub);
}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}

/* グッド */
.good{display:flex;align-items:center;gap:12px;margin-top:24px}
.good-btn{
  display:inline-flex;align-items:center;gap:10px;min-height:46px;min-width:88px;padding:8px 18px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
  font-size:17px;color:var(--ink-sub);justify-content:center;
}
.good-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.good-btn .cnt{font-family:var(--serif);font-weight:700;font-variant-numeric:tabular-nums;min-width:1.2em;text-align:left}
/* 押した状態は塗らずに、深緑の太枠と親指の塗りで示す（隣の「テキストをコピー」と張り合わないように） */
.good-btn[aria-pressed="true"]{border:2px solid var(--green);padding:7px 17px;color:var(--green)}
.good-btn[aria-pressed="true"] svg{fill:var(--green)}
.good-btn:disabled{opacity:.6;cursor:default}
.good .hint2{font-size:13px;color:var(--ink-sub)}

/* 札のグッド数 */
.fuda .foot{display:flex;align-items:flex-end;gap:12px;margin-top:14px}
.fuda .foot .tags{flex:1;margin-top:0}
.fuda .side{margin-left:auto;flex:none;display:flex;align-items:center;gap:14px;font-size:13px;color:var(--ink-sub)}
.gd{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.gd svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.gd.has{color:var(--green);font-weight:700}
.gd.mine svg{fill:var(--green)}

.chui{
  margin:24px 0;padding:16px 18px;border-radius:var(--r);
  border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--surface);
}
.chui .h{
  display:block;font-family:var(--serif);font-weight:700;font-size:16px;
  letter-spacing:.06em;color:var(--accent);margin-bottom:6px;
}
.chui p{margin:0;font-size:15px;line-height:1.8}
.tejun{margin:0 0 16px;padding-left:1.6em}
.tejun li{margin-bottom:6px}
.kbd{
  display:inline-block;padding:1px 8px;border-radius:4px;font-size:13px;
  background:var(--bg);border:1px solid var(--line);color:var(--green);
}

/* ============ ボタン ============ */
.btn{
  padding:10px 18px;border-radius:var(--r);font-size:14px;letter-spacing:.06em;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--bg);font-weight:700}
.btn.ghost{background:transparent}
.btn.danger{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{flex:none;min-height:38px;padding:8px 16px;font-size:13px}

/* 編集・削除は幹部のみ。帖尻に控えめに */
.shobun{
  display:flex;justify-content:flex-end;align-items:center;gap:6px;
  margin-top:24px;padding-top:14px;border-top:1px solid var(--line);
}
.shobun button{
  display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:8px 10px;
  font-size:13px;letter-spacing:.08em;color:var(--ink-sub);
}
.shobun .lock{
  font-size:11px;letter-spacing:.06em;padding:1px 6px;border-radius:4px;
  border:1px solid var(--line);color:var(--ink-sub);
}
.pop-scrim{
  position:fixed;inset:0;z-index:80;background:rgba(43,42,38,.45);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.pop{
  width:100%;max-width:360px;background:var(--bg);
  border:1px solid var(--line);border-radius:8px;padding:22px 22px 18px;
}
.pop-h{
  font-family:var(--serif);font-weight:700;font-size:18px;letter-spacing:.06em;color:var(--ink);
  padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--line);
}
.pop-d{font-size:15px;line-height:1.8;color:var(--ink-sub)}
.pop .pass{
  display:block;width:100%;margin-top:16px;min-height:46px;padding:8px 12px;
  border:1px solid var(--line);background:var(--surface);
  text-align:center;letter-spacing:.4em;font-size:18px;font-variant-numeric:tabular-nums;
}
.pop .pass:focus{border-color:var(--green-2);outline:none}
.pop-err{margin-top:10px;font-size:14px;color:var(--accent)}
.pop-acts{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}

/* ============ 記帳 ============ */
.form{max-width:720px;margin:32px auto 0;display:flex;flex-direction:column;gap:32px}
.field{display:flex;flex-direction:column;gap:10px}
.field > label{font-size:13px;letter-spacing:.18em;color:var(--ink-sub)}
.field > label .nm{letter-spacing:.04em}
.hint{font-size:13px;line-height:1.8;color:var(--ink-sub);margin:0}
.ctl{
  width:100%;padding:12px 14px;border:1px solid var(--line);
  background:var(--surface);font-size:16px;letter-spacing:.02em;
}
.ctl:focus{border-color:var(--green-2);outline:none}
textarea.ctl{min-height:260px;line-height:1.8;resize:vertical}
.genre-picks{display:flex;flex-wrap:wrap;gap:8px}
.addrow{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.tagadd{
  flex:1 1 160px;max-width:240px;min-height:38px;padding:8px 12px;
  font-size:15px;letter-spacing:.02em;
  border:1px dashed var(--line);background:var(--surface);color:var(--ink);
}
.tagadd:focus{border-style:solid;border-color:var(--green-2);outline:none}
.tagedit{display:flex;flex-wrap:wrap;gap:7px;align-items:center;min-height:32px}
.tagedit .t{
  display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 6px 3px 10px;
  border-radius:4px;background:var(--surface);border:1px solid var(--line);color:var(--ink-sub);
}
.tagedit .t.auto{color:var(--green);border-color:var(--green-2)}
.tagedit .t button{color:inherit;font-size:15px;line-height:1;padding:0 2px;border-radius:0}
.tagedit .none{font-size:14px;color:var(--ink-sub)}
.thumbs{display:flex;flex-wrap:wrap;gap:10px}
.thumb{position:relative;width:100px;height:100px;overflow:hidden;border:1px solid var(--line);border-radius:var(--r)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{
  position:absolute;top:0;right:0;width:26px;height:26px;border-radius:0 var(--r) 0 var(--r);
  background:var(--green);color:var(--bg);font-size:14px;line-height:26px;text-align:center;padding:0;
}
.drop{
  display:block;border:1px dashed var(--line);border-radius:var(--r);background:var(--surface);
  padding:18px;text-align:center;font-size:14px;letter-spacing:.04em;color:var(--ink-sub);cursor:pointer;
}
.preview{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:20px 22px}
.preview .pv-h{font-size:13px;letter-spacing:.2em;color:var(--ink-sub);margin:0 0 14px}
.formbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--line)}
.formbar .msg{font-size:14px;color:var(--ink-sub);letter-spacing:.02em}
.formbar .msg.err{color:var(--accent)}

.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:90;
  background:var(--green);color:var(--bg);padding:10px 22px;border-radius:var(--r);
  font-size:14px;letter-spacing:.08em;
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>

<header class="hata">
  <div class="hata-in">
    <div class="rakkan" aria-hidden="true">帖</div>
    <div class="banner">
      <span class="nm">真戦 兵法帖</span>
      <span class="sub">信長の野望・真戦</span>
    </div>
    <button class="helpbtn" id="helpBtn" type="button" aria-label="使い方"><span class="q" aria-hidden="true">?</span><span class="label">使い方</span></button>
    <div class="tabs" role="tablist" aria-label="表示切替">
      <button id="tabBrowse" role="tab" aria-selected="true">閲覧</button>
      <button id="tabAdd" role="tab" aria-selected="false">記帳</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="notice" class="shirase" hidden></div>

  <!-- ============ 閲覧 ============ -->
  <section id="viewBrowse">
    <div class="sagasu">
      <svg class="mag" width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M12.8 12.8 L17.5 17.5"/></svg>
      <input id="q" type="search" placeholder="身代金／迎撃／士気 …" aria-label="キーワード検索">
      <button class="clr" id="qclr" aria-label="検索条件をすべて解除" hidden>×</button>
    </div>

    <div class="chiprow" id="chips" role="group" aria-label="ジャンル絞り込み"></div>
    <div class="tagline" id="tagline"></div>

    <div class="kensuu">
      <b id="rcount">—</b><span id="rlabel">件</span>
      <span class="rule"></span>
      <button class="mini" id="reload" hidden>更新</button>
      <button class="mini" id="exportAll">一括コピー</button>
    </div>
    <div id="results"></div>
    <div class="musubi">
      <p class="l1">兵 法 帖</p>
      <p class="l2" id="musubi2"></p>
      <button id="helpBtn2" type="button">つかいかたを見る</button>
    </div>
  </section>

<script>
(() => {
"use strict";

/* ============================================================
   設定 ― ここだけ書き換えてください
   ============================================================
   Google Apps Script で作った「ウェブアプリのURL」を貼り付けると、
   全員で同じ帖を読み書きできるようになります。
   （手順は Code.gs の冒頭に書いてあります）

   空のままでも動きますが、その場合は開いた人のブラウザ内にだけ
   保存され、ほかの隊員には見えません。
   ============================================================ */

const GAS_URL = "https://script.google.com/macros/s/AKfycbzeiZ0RhI5htd2I4qOO0MwZOA8M8wLUGIlf4Jfvbe5bBT7x4esu7xgwMYiP4eAAZVE/exec";

/* スプレッドシートに接続していないときだけ使う削除パスコード。
   接続後の削除は Code.gs 側で照合するので、ここを見ても分かりません。 */
const LOCAL_PASS = "0229";

/* ================= 定数 ================= */
const DEFAULT_GENRES = [
  "ゲーム仕様","部隊操作","編成・戦法","武将・育成",
  "内政・資源","同盟・外交","季節戦術","初心者向け"
];
const MAX_AUTO_TAGS = 6;
const MAX_IMAGES = 4;
const IMG_BUDGET = 170000;

const DICT = [
  ["身代金","身代金","みのしろきん"],["捕虜","捕虜","捕縛"],["解放","解放"],
  ["一門","一門","いちもん"],["同盟","同盟"],["停戦","停戦"],["宣戦","宣戦布告","宣戦"],
  ["内応","内応"],["調略","調略"],["諜報","諜報"],["偵察","偵察","斥候"],
  ["出陣","出陣"],["派遣","派遣"],["帰還","帰還"],["駐屯","駐屯"],["迎撃","迎撃"],
  ["行軍","行軍"],["停留","停留"],["集結","集結"],["凸","凸","突撃","凸待ち"],
  ["士気","士気"],["耐久","耐久"],["兵力","兵力"],["負傷兵","負傷兵"],["治療","治療"],
  ["徴兵","徴兵"],["屯田","屯田"],["開拓","開拓"],["略奪","略奪"],
  ["攻城","攻城"],["守城","守城","防衛","防衛戦"],["落城","落城"],["城主","城主"],
  ["幕舎","幕舎"],["砦","砦"],["陣","陣地"],["関所","関所"],["要塞","要塞"],
  ["主城","主城"],["分城","分城"],["支城","支城"],["拠点","拠点"],["遷都","遷都","遷城"],
  ["領地","領地","土地"],["加護","加護"],["占領","占領"],["返還","返還"],
  ["武将","武将"],["戦法","戦法"],["特技","特技"],["兵種","兵種"],
  ["騎兵","騎兵"],["弓兵","弓兵"],["槍兵","槍兵"],["足軽","足軽"],["鉄砲","鉄砲"],
  ["器械","器械","攻城兵器"],["水軍","水軍"],
  ["統率","統率"],["武力","武力"],["知略","知略"],["政治","政治"],["速度","速度"],
  ["覚醒","覚醒"],["進化","進化"],["転生","転生"],["譲渡","譲渡"],["因縁","因縁"],
  ["編成","編成","陣容","部隊編成"],["相性","相性"],["兵法","兵法"],["練兵","練兵","演練"],
  ["内政","内政"],["資源","資源"],["銅銭","銅銭","小判"],["兵糧","兵糧"],
  ["木材","木材"],["石材","石材"],["鉄鉱","鉄鉱","鉄"],["建設","建設"],["施設","施設"],
  ["民忠","民忠"],["治安","治安"],["名声","名声"],["官職","官職"],["功績","功績","武勲"],
  ["シーズン","シーズン","季節","新シーズン"],["スタートダッシュ","スタートダッシュ","スタダ"],
  ["開幕","開幕","初動"],["序盤","序盤"],["中盤","中盤"],["終盤","終盤"],
  ["群雄","群雄"],["討伐","討伐"],["イベント","イベント"],
  ["招賢","招賢","招集","ガチャ"],["デイリー","デイリー","日課"],
  ["初心者","初心者","初心者向け"],["無課金","無課金","微課金"],
  ["バグ","バグ","不具合"],["仕様","仕様"],["立ち回り","立ち回り","プレイング"]
];

/* ================= 補助 ================= */
const $ = s => document.querySelector(s);
const el = (t, c) => { const n = document.createElement(t); if (c) n.className = c; return n; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fmtDate = iso => { const d = new Date(iso); return isNaN(d) ? "" : `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`; };
const bare = t => String(t).replace(/^[【\[]|[】\]]$/g, "");

function toast(msg) {
  const t = $("#toast"); t.innerHTML = "";
  const n = el("div", "toast"); n.textContent = msg; t.appendChild(n);
  setTimeout(() => { if (n.parentNode) n.remove(); }, 2200);
}

function downloadText(name, text) {
  const blob = new Blob([text], { type: "text/markdown;charset=utf-8" });
  const a = el("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

/* 親指（グッド）の線画。絵文字は使わない決まりなので自前で描きます */
const THUMB = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10v11H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h3zM7 10l4-8a2.5 2.5 0 0 1 2.5 2.5V9h5.6a2 2 0 0 1 2 2.3l-1.3 8a2 2 0 0 1-2 1.7H7"/></svg>`;

/* ================= 本文整形 ================= */
function inline(s) { return s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); }
function renderDoc(src) {
  const lines = esc(src || "").split(/\r?\n/);
  let out = "", list = null;
  const close = () => { if (list) { out += `</${list}>`; list = null; } };
  for (const raw of lines) {
    const l = raw.trim();
    if (!l) { close(); continue; }
    let m;
    if ((m = l.match(/^#{1,4}\s*(.+)$/))) { close(); out += `<h3>${inline(m[1])}</h3>`; continue; }
    if ((m = l.match(/^[・･]\s*(.+)$/)) || (m = l.match(/^[-*]\s+(.+)$/))) {
      if (list !== "ul") { close(); out += "<ul>"; list = "ul"; }
      out += `<li>${inline(m[1])}</li>`; continue;
    }
    if ((m = l.match(/^(\d+)[.、）)]\s*(.+)$/))) {
      if (list !== "ol") { close(); out += "<ol>"; list = "ol"; }
      out += `<li>${inline(m[2])}</li>`; continue;
    }
    close();
    out += `<p>${inline(l)}</p>`;
  }
  close();
  return out;
}
const snippet = (src, n) => String(src || "").replace(/[#*【】]/g, "").replace(/\s+/g, " ").trim().slice(0, n || 96);

/* ================= 自動タグ ================= */
function autoTags(title, body, genre) {
  const text = `${title || ""}\n${title || ""}\n${body || ""}`;
  const scored = [];
  for (const entry of DICT) {
    const tag = entry[0];
    let count = 0;
    for (let i = 1; i < entry.length; i++) {
      const a = entry[i]; let idx = 0;
      while ((idx = text.indexOf(a, idx)) !== -1) { count++; idx += a.length; }
    }
    if (count > 0) scored.push({ tag, count, len: tag.length });
  }
  const br = (title || "").match(/[【\[]([^】\]]{2,14})[】\]]/);
  if (br) {
    const inner = br[1].replace(/について$|の話$|まとめ$/, "").trim();
    if (inner && inner.length <= 12 && !scored.some(s => s.tag === inner)) scored.unshift({ tag: inner, count: 99, len: inner.length });
  }
  scored.sort((a, b) => b.count - a.count || b.len - a.len);
  const out = scored.slice(0, MAX_AUTO_TAGS).map(s => s.tag);
  if (genre && out.length < MAX_AUTO_TAGS && !out.includes(genre)) out.push(genre.replace(/[・]/g, ""));
  return out;
}

/* ================= 通信 ================= */
const state = {
  mode: "local",
  pass: null,                 /* 幹部として確認できたらここに入ります（この画面を開いている間だけ） */
  liked: new Set((() => { try { return JSON.parse(localStorage.getItem("heihojo.liked") || "[]"); } catch { return []; } })()),
  tips: [], genres: DEFAULT_GENRES.slice(),
  q: "", genre: null, tags: new Set(),
  editing: null, form: { images: [], removedAuto: new Set(), manual: [] }
};
const imgCache = new Map();

function apiErr(j) {
  const e = new Error((j && j.error) || "通信できませんでした");
  e.code = (j && j.code) || "network";
  return e;
}
async function apiGet(params) {
  const u = GAS_URL + (GAS_URL.indexOf("?") >= 0 ? "&" : "?") + new URLSearchParams(params);
  const r = await fetch(u, { method: "GET" });
  const j = await r.json();
  if (!j.ok) throw apiErr(j);
  return j;
}
async function apiPost(payload) {
  const r = await fetch(GAS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  const j = await r.json();
  if (!j.ok) throw apiErr(j);
  return j;
}

/* ================= 保存 ================= */
const LS_TIPS = "heihojo.tips", LS_IMGS = "heihojo.imgs", LS_GENRES = "heihojo.genres";
function lsRead(k, fb) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } }
function lsWrite(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }

const store = {
  async refresh() {
    if (state.mode === "sheet") {
      const j = await apiGet({ action: "list" });
      state.tips = j.tips || [];
      if (j.genres && j.genres.length) state.genres = j.genres;
    } else {
      state.tips = lsRead(LS_TIPS, []).sort((a, b) => (b.updatedAt || "").localeCompare(a.updatedAt || ""));
      state.genres = lsRead(LS_GENRES, DEFAULT_GENRES.slice());
    }
    renderAll();
  },

  /* 幹部かどうかの確認。合っていればこの画面を開いている間だけ覚えます。 */
  async auth(pass) {
    if (state.mode === "sheet") await apiPost({ action: "auth", pass });
    else if (pass !== LOCAL_PASS) throw apiErr({ code: "bad_pass", error: "パスコードが違います" });
    state.pass = pass;
  },

  /* images: 既存は画像ID、新規は data:... の文字列
     既にある項目の書き換え（編集）は、サーバー側で幹部パスコードを照合します。 */
  async saveTip(tip, images) {
    if (state.mode === "sheet") {
      await apiPost({ action: "save", tip, images, pass: state.pass });
    } else {
      const ids = [];
      const map = lsRead(LS_IMGS, {});
      for (const v of images) {
        if (String(v).indexOf("data:") === 0) { const id = uid(); map[id] = v; imgCache.set(id, v); ids.push(id); }
        else ids.push(v);
      }
      lsWrite(LS_IMGS, map);
      tip.images = ids;
      const all = lsRead(LS_TIPS, []).filter(t => t.id !== tip.id);
      all.push(tip); lsWrite(LS_TIPS, all);
    }
    await store.refresh();
  },

  async deleteTip(tip) {
    if (state.mode === "sheet") {
      await apiPost({ action: "delete", id: tip.id, pass: state.pass });
    } else {
      if (state.pass !== LOCAL_PASS) throw apiErr({ code: "bad_pass", error: "パスコードが違います" });
      lsWrite(LS_TIPS, lsRead(LS_TIPS, []).filter(t => t.id !== tip.id));
      const map = lsRead(LS_IMGS, {});
      for (const id of (tip.images || [])) delete map[id];
      lsWrite(LS_IMGS, map);
    }
    await store.refresh();
  },

  /* グッド：delta は +1 か -1。戻り値は新しい数 */
  async like(tip, delta) {
    let n;
    if (state.mode === "sheet") {
      n = (await apiPost({ action: "like", id: tip.id, delta })).likes;
    } else {
      const all = lsRead(LS_TIPS, []);
      const x = all.find(a => a.id === tip.id);
      n = Math.max(0, ((x && x.likes) || 0) + delta);
      if (x) { x.likes = n; lsWrite(LS_TIPS, all); }
    }
    tip.likes = n;
    return n;
  },

  async getImage(id) {
    if (imgCache.has(id)) return imgCache.get(id);
    let url = null;
    if (state.mode === "sheet") {
      try { url = (await apiGet({ action: "img", id })).dataUrl; } catch { url = null; }
    } else {
      url = lsRead(LS_IMGS, {})[id] || null;
    }
    if (url) imgCache.set(id, url);
    return url;
  },

  async saveGenres(list) {
    state.genres = list;
    if (state.mode === "sheet") { try { await apiPost({ action: "genres", list }); } catch (e) { console.error(e); } }
    else lsWrite(LS_GENRES, list);
  }
};

/* ================= 検索 ================= */
function allTagCounts(tips) {
  const m = new Map();
  for (const t of tips) for (const g of (t.tags || [])) m.set(g, (m.get(g) || 0) + 1);
  return [...m.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "ja"));
}
function matches(t) {
  if (state.genre && t.genre !== state.genre) return false;
  for (const tag of state.tags) if (!(t.tags || []).includes(tag)) return false;
  const q = state.q.trim().toLowerCase();
  if (!q) return true;
  const hay = `${t.title} ${t.body} ${(t.tags||[]).join(" ")} ${t.genre} ${t.author||""}`.toLowerCase();
  return q.split(/\s+/).every(w => hay.includes(w));
}
const filtered = () => state.tips.filter(matches);

/* ================= 描画：閲覧 ================= */
function genreCounts() {
  const m = new Map(state.genres.map(g => [g, 0]));
  for (const t of state.tips) m.set(t.genre, (m.get(t.genre) || 0) + 1);
  return m;
}

function renderChips() {
  const counts = genreCounts();
  const box = $("#chips"); box.innerHTML = "";
  const mk = (label, val, n) => {
    const b = el("button", "gchip"); b.type = "button";
    b.setAttribute("aria-pressed", String(state.genre === val));
    b.innerHTML = `${esc(label)}<span class="n">${n}</span>`;
    b.onclick = () => { state.genre = state.genre === val ? null : val; renderAll(); };
    return b;
  };
  box.appendChild(mk("すべて", null, state.tips.length));
  for (const [g, n] of counts) box.appendChild(mk(g, g, n));

}

function renderTagline() {
  const box = $("#tagline"); box.innerHTML = "";
  const counts = allTagCounts(state.tips);
  if (!counts.length) return;
  const lbl = el("span", "lbl"); lbl.textContent = "よく使われる語"; box.appendChild(lbl);
  for (const [tag] of counts.slice(0, 16)) {
    const b = el("button", "tag"); b.type = "button";
    b.setAttribute("aria-pressed", String(state.tags.has(tag)));
    b.textContent = `#${tag}`;
    b.onclick = () => { state.tags.has(tag) ? state.tags.delete(tag) : state.tags.add(tag); renderAll(); };
    box.appendChild(b);
  }
}

function tipCard(t) {
  const c = el("button", "fuda"); c.type = "button";
  const tags = (t.tags || []).slice(0, 5).map(x => `<span class="tag">#${esc(x)}</span>`).join("");
  c.innerHTML =
    `<div class="k"><span>${esc(t.genre)}</span><span class="meta">${esc(t.author || "")}${t.author ? " ・ " : ""}${fmtDate(t.updatedAt || t.createdAt)}</span></div>` +
    `<h3>【${esc(bare(t.title))}】</h3>` +
    `<p>${esc(snippet(t.body, 110))}</p>` +
    `<div class="foot">` +
      `<div class="tags">${tags}</div>` +
      `<div class="side">` +
        ((t.images || []).length ? `<span>図 ${t.images.length}</span>` : "") +
        `<span class="gd${(t.likes || 0) > 0 ? " has" : ""}${state.liked.has(t.id) ? " mine" : ""}" aria-label="グッド ${t.likes || 0}">${THUMB}${t.likes || 0}</span>` +
      `</div>` +
    `</div>`;
  c.onclick = () => openSheet(t.id);
  return c;
}

function renderResults() {
  const box = $("#results"); box.innerHTML = "";
  const list = filtered();
  const active = !!(state.q.trim() || state.tags.size || state.genre);
  $("#rcount").textContent = String(list.length);
  $("#rlabel").textContent = active ? "件 該当" : "件 収録";
  $("#qclr").hidden = !active;

  const latest = state.tips.reduce((a, t) => (t.updatedAt || "") > a ? (t.updatedAt || "") : a, "");
  $("#musubi2").textContent = state.tips.length
    ? `全 ${state.tips.length} 項${latest ? " ／ 最終記帳 " + fmtDate(latest) : ""}`
    : "";

  if (!list.length) {
    const e = el("div", "karappo");
    e.innerHTML = state.tips.length
      ? "<b>該当なし</b>語やタグを外して、もう一度お試しください。"
      : "<b>まだ一項もありません</b>「記帳」から最初の一項を書き加えてください。";
    box.appendChild(e); return;
  }

  const grouped = !state.q.trim() && !state.tags.size;
  if (!grouped) {
    const l = el("div", "list");
    for (const t of list) l.appendChild(tipCard(t));
    box.appendChild(l); return;
  }
  const order = [...new Set([...state.genres, ...list.map(t => t.genre)])];
  for (const g of order) {
    const items = list.filter(t => t.genre === g);
    if (!items.length) continue;
    const sec = el("section", "gsec");
    const h = el("div", "gsec-h");
    h.innerHTML = `<span class="dia"></span><h2>${esc(g)}</h2><span class="n">${items.length}</span>`;
    sec.appendChild(h);
    const l = el("div", "list");
    for (const t of items) l.appendChild(tipCard(t));
    sec.appendChild(l);
    box.appendChild(sec);
  }
}

function renderAll() { renderChips(); renderTagline(); renderResults(); renderGenrePicks(); }

/* ================= 詳細 ================= */
function discordText(t) {
  const tags = (t.tags || []).map(x => "#" + x).join(" ");
  return `ジャンル：${t.genre}\n\n### 【${bare(t.title)}】\n${t.body}\n${tags ? "\n" + tags : ""}`;
}

/* ================= 覆い（詳細・使い方の共通土台） =================
   スマホでは、押したボタンの跡を追うように「幽霊タップ」がもう一度飛ぶことが
   あります。開いた直後の覆いがそれを受け取ると、開いた瞬間に閉じてしまうので、
   ・開いてすぐの数百ミリ秒は無視する
   ・覆いの上で押し始めて、覆いの上で離したときだけ閉じる
   の2段構えにしています。 */
function mountPanel(scrim, sheet) {
  const m = $("#modal");
  scrim.appendChild(sheet);
  m.innerHTML = ""; m.appendChild(scrim);
  document.body.style.overflow = "hidden";

  const onKey = e => { if (e.key === "Escape") close(); };
  function close() {
    m.innerHTML = "";
    document.body.style.overflow = "";
    document.removeEventListener("keydown", onKey);
  }
  document.addEventListener("keydown", onKey);

  const openedAt = Date.now();
  let downOnScrim = false;
  ["pointerdown", "mousedown", "touchstart"].forEach(ev => {
    scrim.addEventListener(ev, e => { downOnScrim = (e.target === scrim); }, { passive: true });
  });
  scrim.addEventListener("click", e => {
    if (e.target !== scrim) return;
    if (Date.now() - openedAt < 400) return;
    if (!downOnScrim) return;
    close();
  });

  const x = sheet.querySelector(".x");
  if (x) x.onclick = close;
  return close;
}

/* ================= 確認の窓 =================
   編集・削除を押したときにだけ、画面中央に小さな窓を出します。
   開いた直後の幽霊タップで閉じないよう、覆いと同じ守りを入れています。 */
function openPop(o) {
  const scrim = el("div", "pop-scrim");
  const pop = el("div", "pop");
  pop.setAttribute("role", "alertdialog");
  pop.setAttribute("aria-modal", "true");
  pop.innerHTML =
    `<p class="pop-h">${esc(o.title)}</p>` +
    `<p class="pop-d">${esc(o.desc)}</p>` +
    (o.needPass ? `<input class="pass" type="password" inputmode="numeric" autocomplete="off" maxlength="12" aria-label="幹部パスコード">` : "") +
    `<p class="pop-err" hidden></p>` +
    `<div class="pop-acts">` +
      `<button type="button" class="btn ghost" data-a="no">やめる</button>` +
      `<button type="button" class="btn ${o.okClass}" data-a="ok">${esc(o.okLabel)}</button>` +
    `</div>`;
  scrim.appendChild(pop);
  document.body.appendChild(scrim);

  const onKey = e => { if (e.key === "Escape") { e.stopPropagation(); close(); } };
  function close() { scrim.remove(); document.removeEventListener("keydown", onKey, true); }
  document.addEventListener("keydown", onKey, true);

  const openedAt = Date.now();
  let downOnScrim = false;
  ["pointerdown", "mousedown", "touchstart"].forEach(ev => {
    scrim.addEventListener(ev, e => { downOnScrim = (e.target === scrim); }, { passive: true });
  });
  scrim.addEventListener("click", e => {
    if (e.target !== scrim || Date.now() - openedAt < 400 || !downOnScrim) return;
    close();
  });

  const inp = pop.querySelector(".pass");
  const err = pop.querySelector(".pop-err");
  const ok  = pop.querySelector('[data-a="ok"]');
  pop.querySelector('[data-a="no"]').onclick = close;

  const run = async () => {
    const v = inp ? inp.value.trim() : null;
    if (inp && !v) { err.textContent = "パスコードを入力してください"; err.hidden = false; inp.focus(); return; }
    ok.disabled = true; err.hidden = true;
    try {
      await o.onOk(v);
      close();
    } catch (e) {
      console.error(e);
      err.textContent = e.code === "bad_pass" ? "パスコードが違います" : o.failMsg + "（" + (e.code || "network") + "）";
      err.hidden = false; ok.disabled = false;
      if (inp) inp.select();
    }
  };
  ok.onclick = run;
  if (inp) {
    inp.addEventListener("input", () => { err.hidden = true; });
    inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); run(); } });
    setTimeout(() => inp.focus(), 60);
  }
  return close;
}

function openSheet(id) {
  const t = state.tips.find(x => x.id === id);
  if (!t) return;

  const sheet = el("div", "sheet");
  sheet.setAttribute("role", "dialog");

    `<div class="sheet-top"><span class="gn">${esc(t.genre)}</span><button class="x" aria-label="閉じる">×</button></div>` +
    `<div class="sheet-body">` +
      `<h1>【${esc(bare(t.title))}】</h1>` +
      `<div class="shots" hidden></div>` +
      `<div class="doc">${renderDoc(t.body)}</div>` +
      `<div class="metabar">${(t.tags||[]).map(x=>`<span class="tag">#${esc(x)}</span>`).join("")}` +
        `<span style="margin-left:auto">${esc(t.author||"名無し")} ・ ${fmtDate(t.createdAt)}${t.updatedAt && t.updatedAt !== t.createdAt ? "（更新 " + fmtDate(t.updatedAt) + "）" : ""}</span></div>` +
      `<div class="good"><button type="button" class="good-btn" data-a="like" aria-label="グッド">${THUMB}<span class="cnt"></span></button><span class="hint2"></span></div>` +
      `<div class="acts">` +
        `<button class="btn primary" data-a="copy">テキストをコピー</button>` +
        `<button class="btn" data-a="dl">Markdownで保存</button>` +
      `</div>` +
      `<div class="shobun">` +
        `<button data-a="edit" type="button">編集<span class="lock">幹部</span></button>` +
        `<button data-a="del" type="button">削除<span class="lock">幹部</span></button>` +
      `</div>` +
    `</div>`;
  const close = mountPanel(scrim, sheet);

  /* --- グッド --- */
  const likeBtn = sheet.querySelector('[data-a="like"]');
  const likeHint = sheet.querySelector(".good .hint2");
  const paintLike = () => {
    const on = state.liked.has(t.id);
    likeBtn.setAttribute("aria-pressed", String(on));
    likeBtn.querySelector(".cnt").textContent = String(t.likes || 0);
    likeHint.textContent = on ? "もう一度押すと取り消し" : "役に立ったらグッドを";
  };
  paintLike();
  likeBtn.onclick = async () => {
    const was = state.liked.has(t.id);
    const delta = was ? -1 : 1;
    const before = t.likes || 0;
    /* 先に見た目を変え、失敗したら戻す */
    was ? state.liked.delete(t.id) : state.liked.add(t.id);
    t.likes = Math.max(0, before + delta);
    paintLike(); likeBtn.disabled = true;
    try {
      await store.like(t, delta);
      try { localStorage.setItem("heihojo.liked", JSON.stringify([...state.liked])); } catch {}
      paintLike(); renderResults();
    } catch (e) {
      console.error(e);
      was ? state.liked.add(t.id) : state.liked.delete(t.id);
      t.likes = before; paintLike();
      toast("送れませんでした。通信を確かめてください");
    } finally { likeBtn.disabled = false; }
  };

  const shots = sheet.querySelector(".shots");
  if ((t.images || []).length) {
    shots.hidden = false;
    (async () => {
      for (const iid of t.images) {
        const url = await store.getImage(iid);
        if (!url) continue;
        const img = new Image();
        img.src = url; img.alt = bare(t.title) + " の図"; img.loading = "lazy";
        shots.appendChild(img);
      }
    })();
  }

  sheet.querySelector('[data-a="copy"]').onclick = async () => {
    try { await navigator.clipboard.writeText(discordText(t)); toast("コピーしました"); }
    catch { toast("コピーできませんでした"); }
  };
  sheet.querySelector('[data-a="dl"]').onclick = () => {
    downloadText(`${bare(t.title).replace(/[\\/:*?"<>|]/g, "")}.md`, discordText(t));
  };
  /* --- 編集・削除（幹部のみ）。押したときだけ確認の窓を出します --- */
  const name = "【" + bare(t.title) + "】";
  sheet.querySelector('[data-a="edit"]').onclick = () => {
    if (state.pass) { close(); startEdit(t); return; }
    openPop({
      title: "編集は幹部のみです",
      desc: name + " を編集します。幹部パスコードを入力してください。",
      needPass: true, okLabel: "編集する", okClass: "primary", failMsg: "確認できませんでした",
      onOk: async v => { await store.auth(v); close(); startEdit(t); }
    });
  };
  sheet.querySelector('[data-a="del"]').onclick = () => {
    const authed = !!state.pass;
    openPop({
      title: "項目を削除します",
      desc: authed
        ? name + " を一覧から削除します。よろしいですか。"
        : name + " を一覧から削除します。幹部パスコードを入力してください。",
      needPass: !authed, okLabel: "削除する", okClass: "danger", failMsg: "削除できませんでした",
      onOk: async v => {
        if (!state.pass) await store.auth(v);
        await store.deleteTip(t);
        close(); toast("削除しました");
      }
    });
  };
}

function refreshTags() {
  const { auto, manual } = currentTags();
  const box = $("#tagEdit"); box.innerHTML = "";

async function compress(file) {
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch {
    bmp = await new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = fr.result; };
      fr.onerror = rej; fr.readAsDataURL(file);
    });
  }
  const bw = bmp.width || bmp.naturalWidth, bh = bmp.height || bmp.naturalHeight;
  let scale = Math.min(1, 1280 / Math.max(bw, bh)), q = 0.82, last = null;
  for (let i = 0; i < 9; i++) {
    const w = Math.max(1, Math.round(bw * scale)), h = Math.max(1, Math.round(bh * scale));
    const c = el("canvas"); c.width = w; c.height = h;
    c.getContext("2d").drawImage(bmp, 0, 0, w, h);
    const url = c.toDataURL("image/jpeg", q);
    last = { dataUrl: url, w, h };
    if (url.length <= IMG_BUDGET) return last;
    if (q > 0.46) q -= 0.12; else scale *= 0.78;
  }
  return last;
}

  e.preventDefault();
  const title = bare($("#fTitle").value.trim());
  const body = $("#fBody").value.trim();
  const genre = $("#genrePicks").dataset.value;
  const msg = $("#fMsg");
  if (!title) { msg.textContent = "表題を入力してください"; msg.className = "msg err"; $("#fTitle").focus(); return; }
  if (!body) { msg.textContent = "本文を入力してください"; msg.className = "msg err"; $("#fBody").focus(); return; }

  const btn = $("#fSave"); btn.disabled = true;
  msg.textContent = "保存しています…"; msg.className = "msg";
  try {
    const now = new Date().toISOString();
    const prev = state.tips.find(t => t.id === state.editing);
    const author = $("#fAuthor").value.trim();
    if (author) { try { localStorage.setItem("heihojo.author", author); } catch {} }
    const tip = {
      id: state.editing || uid(), genre, title, body,
      tags: currentTags().all, author,
      createdAt: prev ? prev.createdAt : now,
      updatedAt: now
    };
    const images = state.form.images.map(im => im.id || im.dataUrl);
    await store.saveTip(tip, images);
    const wasEdit = !!state.editing;
    try { resetForm(); } catch (e2) { console.error(e2); }
    toast(wasEdit ? "書き改めました" : "帖に記しました");
    setTab("browse");
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (err) {
    console.error("save failed", err);
    msg.className = "msg err";
    if (err.code === "bad_pass") {
      state.pass = null;
      msg.textContent = "編集の権限が確認できませんでした。一覧に戻って、もう一度「編集」から入り直してください。";
    } else {
      msg.textContent = "保存できませんでした。通信を確かめて、もう一度お試しください。（" + (err.code || "network") + "）";
    }
  } finally { btn.disabled = false; }
});

$("#exportAll").onclick = async () => {
  const list = filtered();
  if (!list.length) return;
  const byGenre = new Map();
  for (const t of list) { if (!byGenre.has(t.genre)) byGenre.set(t.genre, []); byGenre.get(t.genre).push(t); }
  let out = "";
  for (const [g, items] of byGenre) {
    out += `━━━ ${g} ━━━\n\n`;
    for (const t of items) out += discordText(t) + "\n\n";
  }
  try { await navigator.clipboard.writeText(out.trim()); toast(`${list.length}件をコピーしました`); }
  catch { toast("コピーできませんでした"); }
};

$("#reload").onclick = async () => {
  $("#reload").disabled = true;
  try { await store.refresh(); toast("最新にしました"); }
  catch (e) { toast("読み込めませんでした"); }
  finally { $("#reload").disabled = false; }
};

/* ================= 起動 ================= */
function setNotice(html) { const n = $("#notice"); n.innerHTML = html; n.hidden = false; }

try { $("#fAuthor").value = localStorage.getItem("heihojo.author") || ""; } catch {}
try { resetForm(); setTab("browse"); } catch (e) { console.error("boot", e); }

/* はじめて開いた人には、一度だけ使い方を出します */
try {
  if (!localStorage.getItem("heihojo.seen")) {
    localStorage.setItem("heihojo.seen", "1");
    setTimeout(openHelp, 500);
  }
} catch {}

(async () => {
  if (!GAS_URL) {
    state.mode = "local";
    setNotice("<b>控えのみの保存です</b>スプレッドシートに接続していないため、この端末のブラウザ内にだけ保存されます。" +
              "Code.gs の手順どおりに設置して、このファイルの GAS_URL にURLを貼ると全員で共有できます。");
    await store.refresh();
    return;
  }
  $("#reload").hidden = false;
  try {
    state.mode = "sheet";
    await store.refresh();
    $("#notice").hidden = true;
  } catch (e) {
    console.error(e);
    state.mode = "local";
    $("#reload").hidden = true;
    setNotice("<b>スプレッドシートに接続できませんでした</b>URLの貼り間違い、またはデプロイの「アクセスできるユーザー」が" +
              "「全員」になっていない可能性があります。いまは控えのみの保存で動いています。（" + esc(e.code || "network") + "）");
    await store.refresh();
  }
})();

})();
</script>
